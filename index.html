  @media (min-width: 768px) {

    suggestion: 'ฝึกหยุดสังเกตอารมณ์ของตัวเอง 5–10 วินาทีก่อนตอบสนองในสถานการณ์ที่กดดัน เพื่อเลือกวิธีตอบสนองอย่างมีสติมากขึ้น'
  },
  D4: {
    name: 'การสร้างแรงจูงใจและพัฒนาคน',
    strength: 'คุณมีแนวโน้มสร้างแรงจูงใจจากภายใน เปิดพื้นที่ให้ทีมคิด ตัดสินใจ และเรียนรู้ ทำให้คนไม่ได้เพียงทำงานสำเร็จ แต่ค่อย ๆ พึ่งพาตัวเองได้มากขึ้น',
    development: 'ลองขยับจากการ “ทำให้คนทำตาม” ไปสู่การสร้าง Ownership ด้วยการเชื่อมงานกับความหมาย ให้พื้นที่ตัดสินใจ และใช้ข้อผิดพลาดเป็นโอกาสในการพัฒนาคน',
    suggestion: 'ลองมอบหมายงานที่มีพื้นที่ให้ตัดสินใจเอง พร้อมกำหนดผลลัพธ์ที่ชัดเจน แทนการกำหนดวิธีการทีละขั้นตอน'
  }
};

var DIMENSION_ORDER = ['D1', 'D2', 'D3', 'D4'];
var DIMENSION_QUESTION_INDEXES = { D1: [0,1,2,3], D2: [4,5,6,7], D3: [8,9,10,11], D4: [12,13,14,15] };

// Single, clearly-named configuration constant for deterministic tie-break
// order (requirement #6). When two or more dimensions land on the exact
// same score, whichever appears first here wins the tie — reviewable and
// changeable in one place, never randomized, never based on score.
var TIE_BREAK_ORDER = DIMENSION_ORDER;

function emptyAnswers() {
  return [null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null];
}

var MOTIVATION_OPTIONS = [
  { id: 'understand_self', label: 'อยากเข้าใจสไตล์การเป็นผู้นำของตัวเอง' },
  { id: 'communicate_team', label: 'อยากสื่อสารกับทีมให้เข้าใจกันมากขึ้น' },
  { id: 'motivate_ownership', label: 'อยากสร้างแรงจูงใจและ Ownership ให้ทีม' },
  { id: 'facing_problem', label: 'กำลังเจอปัญหาในการบริหารหรือพัฒนาทีม' },
  { id: 'interested_leadership_dev', label: 'สนใจแนวทางพัฒนาภาวะผู้นำ' },
  { id: 'other', label: 'อื่น ๆ' }
];

function emptyLead() {
  return {
    email: '',
    motivation: null,
    motivationOther: '',
    startedAt: null,
    completedAt: null,
    ctaClicked: false
  };
}

function isValidEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
}

// ---------------------------------------------------------------------
// LINE OA hand-off + lead data structure (frontend + config only — no
// automation and no CRM integration built yet).
//
// LINE_INTENT_CODE ("asspol" = Assessment – Psychology of Leadership) is
// the code this assessment's CTA is meant to carry through to LINE, so a
// future LINE OA flow can recognize where the lead came from and reply
// with a dedicated greeting, e.g.:
//
//   สวัสดีค่ะ ขอบคุณที่ทำแบบประเมิน Leadership Motivation Assessment 🌱
//   หากต้องการพูดคุยเพิ่มเติมเกี่ยวกับผลประเมิน
//   หรืออยากให้ทีมช่วยแนะนำแนวทางพัฒนาภาวะผู้นำที่เหมาะกับคุณ
//   สามารถพิมพ์คำว่า ASSPOL เพื่อเริ่มต้นพูดคุยกับทีม LifeEnricher ได้เลยค่ะ
//
// This greeting is NOT live — no LINE automation exists yet. Nothing in
// this file claims otherwise.
//
// LINE_OA_URL and CRM_ENDPOINT_URL are placeholders until a real
// LifeEnricher LINE OA link and/or CRM endpoint are provided — swap them
// in here once available. Until then the CTA safely points nowhere
// (buildLineHref() below returns an inert anchor) and getLeadRecord()
// below simply assembles the lead data structure without sending it
// anywhere.
// ---------------------------------------------------------------------
var LINE_OA_URL = 'https://lhco.li/4repHOq';
var LINE_INTENT_CODE = 'asspol';
var CRM_ENDPOINT_URL = 'CRM_ENDPOINT_URL';

function buildLineHref() {
  var notConfigured = !LINE_OA_URL || LINE_OA_URL === 'LINE_OA_URL';
  if (notConfigured) return '#line-oa-not-configured';
  var sep = LINE_OA_URL.indexOf('?') === -1 ? '?' : '&';
  return LINE_OA_URL + sep + 'lead_source=' + encodeURIComponent(LINE_INTENT_CODE);
}
var state={step:'intro',qIndex:0,answers:emptyAnswers(),lead:emptyLead(),showErrors:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stats(){return DIMENSION_ORDER.map(function(dim){var raw=DIMENSION_QUESTION_INDEXES[dim].reduce((sum,i)=>sum+((state.answers[i]&&state.answers[i].score)||0),0);var pct=Math.max(0,Math.min(100,Math.round(((raw-4)/12)*100)));return {id:dim,name:DIMENSION_META[dim].name,raw:raw,pct:pct}})}
function strengthRank(a){return a.slice().sort((x,y)=>y.pct-x.pct||TIE_BREAK_ORDER.indexOf(x.id)-TIE_BREAK_ORDER.indexOf(y.id))}
function devRank(a){return a.slice().sort((x,y)=>x.pct-y.pct||TIE_BREAK_ORDER.indexOf(x.id)-TIE_BREAK_ORDER.indexOf(y.id))}
function captureParams(){var p=new URLSearchParams(location.search); return {utm_source:p.get('utm_source')||'',utm_medium:p.get('utm_medium')||'',utm_campaign:p.get('utm_campaign')||'',utm_content:p.get('utm_content')||'',utm_term:p.get('utm_term')||'',referrer:document.referrer||''}}
function leadRecord(){var s=stats(), strongest=strengthRank(s)[0];return Object.assign({},state.lead,captureParams(),{result:strongest.name,result_dimension:strongest.id,dimension_scores:s,answers:state.answers.map(a=>a?{id:a.id,score:a.score}:null),page_url:location.href})}
function maybeSend(eventName){var rec=Object.assign({event:eventName,timestamp:new Date().toISOString()},leadRecord()); try{localStorage.setItem('le_assessment_last',JSON.stringify(rec))}catch(e){}; if(CRM_ENDPOINT_URL&&CRM_ENDPOINT_URL!=='CRM_ENDPOINT_URL'){fetch(CRM_ENDPOINT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec),keepalive:true}).catch(()=>{})}}
function header(){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:28px 24px 0"><div style="display:flex;align-items:center;gap:8px"><div style="width:6px;height:6px;border-radius:50%;background:#972626"></div><div style="font-size:11px;font-weight:700;letter-spacing:.16em;opacity:.7">LIFEENRICHER</div></div></div>`}
function intro(){var m=state.lead.motivation;return `<div class="le-root"><div style="min-height:844px;display:flex;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:28px 24px 0"><div style="display:flex;align-items:center;gap:8px"><div style="width:6px;height:6px;border-radius:50%;background:#972626"></div><div style="font-size:11px;font-weight:700;letter-spacing:.16em;opacity:.7">LIFEENRICHER</div></div><div style="font-size:10.5px;font-weight:700;color:#972626;border:1px solid rgba(151,38,38,.28);border-radius:999px;padding:5px 9px">เวอร์ชันทดสอบภายใน</div></div>
<div style="padding:18px 24px 0"><div style="font-size:12px;font-weight:700;letter-spacing:.12em;color:#972626;margin-bottom:18px">เครื่องมือประเมินเพื่อการเรียนรู้ตนเอง</div><h1 style="margin:0;font-size:34px;line-height:1.22;font-weight:800">แบบประเมิน<br>แรงจูงใจการเป็นผู้นำ</h1><div style="width:48px;height:3px;background:#972626;border-radius:2px;margin:20px 0"></div><p style="margin:0;font-size:15px;line-height:1.75;opacity:.82">ค้นพบแรงจูงใจเบื้องหลังการตัดสินใจของคุณ และวิธีที่มันหล่อหลอมการนำทีมในแบบของคุณ — เพื่อเข้าใจตนเองอย่างลึกซึ้ง และนำคนด้วยความเข้าใจที่แท้จริง</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px"><span>16 คำถาม</span><span>• 5–7 นาที</span><span>• ผลลัพธ์เฉพาะบุคคล</span></div><p style="font-size:12px;line-height:1.7;opacity:.48">แบบสำรวจนี้เป็นเครื่องมือสะท้อนแนวคิดผู้นำเพื่อการพัฒนาตนเอง ไม่ใช่แบบทดสอบทางจิตวิทยาที่ผ่านการรับรอง</p></div>
<div style="height:1px;background:rgba(28,24,25,.1);margin:24px"></div><div style="padding:0 24px"><div style="font-size:13.5px;font-weight:700;margin-bottom:4px">อีเมลของคุณ</div><div style="font-size:12.5px;opacity:.6;margin-bottom:12px">เพื่อรับผลประเมินและคำแนะนำที่เหมาะกับคุณ</div><input id="email" class="le-input" type="email" placeholder="you@example.com" value="${esc(state.lead.email)}">${state.showErrors&&!isValidEmail(state.lead.email)?'<div class="le-error-text">กรุณากรอกอีเมลที่ถูกต้อง</div>':''}</div>
<div style="padding:24px 24px 0"><div style="font-size:13.5px;font-weight:700;margin-bottom:12px">อะไรคือเหตุผลหลักที่ทำให้คุณสนใจทำแบบประเมินนี้?</div><div style="display:flex;flex-direction:column;gap:10px">${MOTIVATION_OPTIONS.map(o=>`<button class="le-card ${m===o.id?'selected':''}" data-mot="${o.id}" style="padding:13px 16px"><span class="le-dot"></span><span style="font-size:13.5px">${esc(o.label)}</span></button>`).join('')}</div>${state.showErrors&&!m?'<div class="le-error-text">กรุณาเลือกเหตุผลอย่างน้อย 1 ข้อ</div>':''}${m==='other'?`<div style="margin-top:12px"><input id="other" class="le-input" type="text" placeholder="โปรดระบุ" value="${esc(state.lead.motivationOther)}">${state.showErrors&&!state.lead.motivationOther.trim()?'<div class="le-error-text">กรุณาระบุเหตุผลของคุณ</div>':''}</div>`:''}</div>
<div style="padding:26px 24px 30px"><button id="start" class="le-btn-primary" style="width:100%;background:#972626;color:#F9F9F9;border:0;border-radius:14px;padding:17px 20px;font:inherit;font-weight:700">เริ่มทำแบบประเมิน →</button><div style="text-align:center;font-size:11.5px;opacity:.5;margin-top:14px">ข้อมูลของคุณจะถูกเก็บเป็นความลับ • ไม่ต้องเข้าสู่ระบบ • ไม่ต้องตั้งรหัสผ่าน</div></div></div></div>`}
function question(){var q=QUESTIONS[state.qIndex],ans=state.answers[state.qIndex],pct=Math.round((state.qIndex+1)/16*100);return `<div class="le-root"><div style="min-height:844px;display:flex;flex-direction:column"><div style="display:flex;justify-content:space-between;padding:24px 24px 0"><button id="back" style="border:1px solid #ddd;background:none;border-radius:50%;width:32px;height:32px">‹</button><div style="font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.55">แรงจูงใจการเป็นผู้นำ</div><button id="exit" class="le-text-link" style="border:0;background:none">ออก</button></div><div style="padding:22px 24px 0"><div style="display:flex;justify-content:space-between;margin-bottom:9px"><b>คำถาม ${state.qIndex+1} จาก 16</b><b style="color:#972626">${pct}%</b></div><div class="le-meter-track"><div class="le-meter-fill" style="width:${pct}%"></div></div></div><div style="flex:1;padding:30px 24px 0"><h2 style="margin:0 0 22px;font-size:21px;line-height:1.5">${esc(q.text).split('\n').join('<br>')}</h2><div style="display:flex;flex-direction:column;gap:11px">${q.options.map(o=>`<button class="le-card ${ans&&ans.id===o.id?'selected':''}" data-opt="${o.id}"><span class="le-dot"></span><span>${esc(o.label)}</span></button>`).join('')}</div></div><div style="padding:18px 24px 30px"><button id="next" class="le-next ${ans?'':'disabled'}">${state.qIndex===15?'ดูผลลัพธ์':'ถัดไป'} →</button><div style="text-align:center;margin-top:14px"><button id="back2" class="le-text-link" style="border:0;background:none">ย้อนกลับ</button></div></div></div></div>`}
function result(){var s=stats(),strong=strengthRank(s)[0],dev=devRank(s).filter(d=>d.id!==strong.id).slice(0,3);return `<div class="le-root"><div style="padding-bottom:64px">${header()}<div style="padding:30px 24px 0"><div style="font-size:12px;font-weight:700;letter-spacing:.12em;color:#972626;margin-bottom:14px">ผลการประเมินของคุณ</div><div style="font-size:17px;opacity:.75">จุดแข็งหลักของคุณ</div><h1 style="margin:6px 0 0;font-size:32px;color:#972626">${esc(strong.name)}</h1></div><div style="height:1px;background:#ddd;margin:30px 24px"></div><div style="padding:0 24px"><div style="font-size:12px;font-weight:700;letter-spacing:.12em;color:#972626;margin-bottom:18px">มิติแรงจูงใจของคุณ</div>${s.map(i=>`<div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>${esc(i.name)}</span><b style="color:#972626">${i.pct}%</b></div><div class="le-meter-track"><div class="le-meter-fill" style="width:${i.pct}%"></div></div></div>`).join('')}</div><div style="padding:20px 24px 0"><div style="background:#972626;border-radius:18px;padding:22px;color:#F9F9F9"><div style="font-size:11.5px;font-weight:700;letter-spacing:.1em;opacity:.8;margin-bottom:10px">จุดแข็งของคุณ</div><p style="margin:0;font-size:14.5px;line-height:1.75">${esc(DIMENSION_META[strong.id].strength)}</p></div></div><div style="height:1px;background:#ddd;margin:36px 24px"></div><div style="padding:0 24px"><h3 style="font-size:20px">3 เรื่องที่คุณสามารถพัฒนาต่อได้</h3>${dev.map((i,n)=>`<div style="border:1.5px solid rgba(151,38,38,.35);border-radius:18px;padding:20px;margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center"><b style="background:#972626;color:white;border-radius:50%;width:24px;height:24px;text-align:center">${n+1}</b><b style="flex:1">${esc(i.name)}</b><b style="color:#972626">${i.pct}%</b></div><p style="font-size:13.5px;line-height:1.7">${esc(DIMENSION_META[i.id].development)}</p><p style="font-size:13px;line-height:1.65"><b style="color:#972626">ลองทำ</b> ${esc(DIMENSION_META[i.id].suggestion)}</p></div>`).join('')}</div><div style="height:1px;background:#ddd;margin:40px 24px"></div><div style="padding:0 24px"><div style="font-size:15px;font-weight:600;opacity:.7;margin-bottom:14px">อยากเข้าใจเรื่องนี้ให้ลึกขึ้น?</div><h3 style="margin:0 0 10px;font-size:21px;color:#972626">Psychology of Leadership<br>– Essential Leadership</h3><div style="font-size:15px;font-weight:600;font-style:italic;opacity:.75;margin-bottom:14px">“ก่อนนำใจ ต้องเข้าใจคน”</div><p style="font-size:14px;line-height:1.8;opacity:.7">หากคุณต้องการเข้าใจแรงจูงใจ การสื่อสาร การตัดสินใจ และพฤติกรรมของคนให้ลึกขึ้น ทีม LifeEnricher พร้อมช่วยพูดคุยและแนะนำแนวทางที่เหมาะกับบริบทการนำทีมของคุณ</p><a id="line" class="le-line-btn" href="${buildLineHref()}" target="_blank" rel="noopener" style="width:100%;display:flex;justify-content:center;background:#972626;color:white;border-radius:14px;padding:16px 20px;font-weight:700;text-decoration:none">สอบถามข้อมูลเพิ่มเติม</a><p style="font-size:11.5px;opacity:.5;text-align:center">กดเพื่อเพิ่มเพื่อน LINE Official Account และพูดคุยกับทีม LifeEnricher</p></div><div style="padding:30px 24px;text-align:center"><b style="font-size:11px;letter-spacing:.16em;opacity:.5">LIFEENRICHER</b><div style="font-size:12px;opacity:.4;margin-top:6px">เข้าใจคนอย่างลึกซึ้ง นำด้วยเจตนา</div><button id="restart" class="le-text-link" style="border:0;background:none;margin-top:16px">เริ่มการประเมินใหม่อีกครั้ง</button></div></div></div>`}
function render(){document.getElementById('app').innerHTML=state.step==='intro'?intro():state.step==='question'?question():result(); bind()}
function bind(){if(state.step==='intro'){var e=document.getElementById('email');e.oninput=()=>state.lead.email=e.value;document.querySelectorAll('[data-mot]').forEach(b=>b.onclick=()=>{state.lead.motivation=b.dataset.mot;state.showErrors=false;render()});var o=document.getElementById('other');if(o)o.oninput=()=>state.lead.motivationOther=o.value;document.getElementById('start').onclick=()=>{state.lead.email=e.value.trim();if(o)state.lead.motivationOther=o.value.trim();state.showErrors=true;if(!isValidEmail(state.lead.email)||!state.lead.motivation||(state.lead.motivation==='other'&&!state.lead.motivationOther.trim()))return render();state.lead.startedAt=new Date().toISOString();state.step='question';maybeSend('assessment_start');render();scrollTo(0,0)}}else if(state.step==='question'){document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{state.answers[state.qIndex]=QUESTIONS[state.qIndex].options.find(o=>o.id===b.dataset.opt);render()});var back=()=>{if(state.qIndex===0)state.step='intro';else state.qIndex--;render();scrollTo(0,0)};document.getElementById('back').onclick=back;document.getElementById('back2').onclick=back;document.getElementById('exit').onclick=()=>{state.step='intro';render()};document.getElementById('next').onclick=()=>{if(!state.answers[state.qIndex])return;if(state.qIndex===15){state.lead.completedAt=new Date().toISOString();state.step='result';maybeSend('assessment_complete')}else state.qIndex++;render();scrollTo(0,0)}}else{document.getElementById('line').onclick=()=>{state.lead.ctaClicked=true;maybeSend('line_click')};document.getElementById('restart').onclick=()=>{state={step:'intro',qIndex:0,answers:emptyAnswers(),lead:emptyLead(),showErrors:false};render();scrollTo(0,0)}}}
render();
</script></body></html>
